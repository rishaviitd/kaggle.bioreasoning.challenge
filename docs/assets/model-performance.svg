<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Mean DE/DIR AUROC model comparison</title>
  <desc id="desc">Fine-tuned DeepSeek-R1-Distill-Llama-8B scores 0.70, compared with 0.63 for OpenAI GPT-OSS-120B, an 11 percent relative gain.</desc>
  <defs>
    <linearGradient id="deepseekBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="openaiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .model { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .provider { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .tick { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .score { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .gain { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0369a1; }
      @media (prefers-color-scheme: dark) {
        .title, .model, .score { fill: #f8fafc; }
        .subtitle, .provider, .tick { fill: #94a3b8; }
        .gain { fill: #67e8f9; }
        .grid { stroke: #334155; }
        .track { fill: #1e293b; }
        .openai-logo { fill: #f8fafc; }
      }
    </style>
  </defs>

  <rect width="960" height="390" fill="#ffffff"/>
  <text class="title" x="42" y="46">Mean DE/DIR AUROC</text>
  <text class="subtitle" x="42" y="72">Scientific reasoning and three-class outcome prediction</text>

  <g class="grid" stroke="#e2e8f0" stroke-width="1">
    <line x1="420" y1="94" x2="420" y2="326"/>
    <line x1="532.5" y1="94" x2="532.5" y2="326"/>
    <line x1="645" y1="94" x2="645" y2="326"/>
    <line x1="757.5" y1="94" x2="757.5" y2="326"/>
    <line x1="870" y1="94" x2="870" y2="326"/>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="420" y="350">0.0</text>
    <text x="532.5" y="350">0.2</text>
    <text x="645" y="350">0.4</text>
    <text x="757.5" y="350">0.6</text>
    <text x="870" y="350">0.8</text>
  </g>

