  </g>

  <rect class="track" x="420" y="145" width="450" height="28" rx="8" fill="#f1f5f9"/>
  <rect x="420" y="145" width="354.375" height="28" rx="8" fill="url(#openaiBar)" filter="url(#shadow)"/>
